name: Update eIRB Mirror & Sitemap

on:
  schedule:
    # Run weekly on Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  harvest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Harvest Huron Click Codex API and generate pre-rendered HTML mirror
        run: |
          python3 generate_eirb_sitemap.py

      - name: Commit and push changes if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: update eirb.jsc.nasa.gov mirror and sitemap [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 5
            done
          fi
